[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-backend"
version = "0.1.0"
description = "Official Python backend SDK for Atlas — a typed client over the sk_ Backend API (BAPI)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Atlas" }]
keywords = ["atlas", "auth", "authentication", "backend", "sdk", "bapi"]
dependencies = ["httpx>=0.23"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
    "mypy>=1.5",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["atlas_backend"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
# Private cross-module helpers (_Restriction, _AsyncTransport, ...) are the SDK's
# internal wiring; importing them across our own modules is intentional.
ignore = []

[tool.mypy]
# Runtime target is 3.9 (see requires-python); mypy itself requires a 3.10+
# analysis target, and every annotation is guarded by `from __future__ import
# annotations`, so 3.9 install-time compatibility is preserved.
python_version = "3.10"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
strict_equality = true
files = ["atlas_backend", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
